[package]
name = "natikube-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "natikube"
path = "src/main.rs"

[features]
# Off by default; experiments only (see docs/architecture.md, Performance).
mimalloc = ["dep:mimalloc"]
dhat-heap = ["dep:dhat"]

[dependencies]
mimalloc = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
natikube-core = { workspace = true }
natikube-kube-client = { workspace = true }
natikube-clusters = { workspace = true }
natikube-resources = { workspace = true }
natikube-shell = { workspace = true }
natikube-alerts = { workspace = true }
natikube-settings = { workspace = true }
natikube-updates = { workspace = true }
gpui-kit = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
